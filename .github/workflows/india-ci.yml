name: India Trading Stack CI

on:
  push:
    branches: ["main", "india-nse-integration"]
  pull_request:
    branches: ["main"]

jobs:
  india-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt pytest
      - name: Compile Python
        run: python -m compileall -q data_provider broker trading backtesting scanner research src
      - name: India integration tests
        run: pytest -q tests/test_nse_mcp_fetcher.py tests/test_dhan_integration.py
